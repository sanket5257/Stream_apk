# Project-wide Gradle settings.

# JVM args for Gradle daemon. Increase heap for large Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle parallel build (faster on multi-core machines).
org.gradle.parallel=true

# Enable build cache (skip work already done).
org.gradle.caching=true

# Enable configuration cache (faster Gradle startup).
org.gradle.configuration-cache=true

# AndroidX is mandatory for modern Android development.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Disable build features we don't use (faster builds, smaller APK).
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
