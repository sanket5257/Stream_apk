# Centralized dependency versions.
# Reference these from build.gradle.kts files with `libs.<alias>`.

[versions]
# Build tools
agp = "8.5.2"
kotlin = "1.9.24"

# AndroidX core
coreKtx = "1.13.1"
appcompat = "1.7.0"
activityKtx = "1.9.2"
fragmentKtx = "1.8.3"
lifecycle = "2.8.6"
constraintlayout = "2.1.4"

# UI
material = "1.12.0"

# Storage
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"

# Streaming
# RootEncoder (formerly rtmp-rtsp-stream-client-java) — verify latest at
# https://github.com/pedroSG94/RootEncoder/releases before bumping.
rootencoder = "2.5.6"

# Coroutines
coroutines = "1.8.1"

# Testing
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# UI
material = { module = "com.google.android.material:material", version.ref = "material" }

# Storage
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# Streaming — RootEncoder provides RTMP, camera, audio, and OpenGL overlay pipeline.
rootencoder-library = { module = "com.github.pedroSG94.RootEncoder:library", version.ref = "rootencoder" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
